# ===================================================================
# Spring Boot configuration.
#
# This configuration will be overridden by the Spring profile you use,
# for example application-dev.yml if you use the "dev" profile.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
# ===================================================================

management:
    tracing:
        export:
            enabled: ${MANAGEMENT_TRACING_EXPORT_ENABLED:false}
    otlp:
        metrics:
            export:
                enabled: ${MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED:false}
    endpoints:
        web:
            base-path: /management
            exposure:
                include: ["configprops", "env", "health", "info", "threaddump", "logfile", "jhimetrics", "prometheus" ]
    endpoint:
        health:
            show-details: when-authorized
    info:
        git:
            mode: full
    health:
        mail:
            enabled: false # When using the MailService, configure an SMTP server and set this to true
    prometheus:
        metrics:
            export:
                enabled: true
                step: 60
    metrics:
        enable:
            http: true
            jvm: true
            logback: true
            process: true
            system: true
spring:
    jackson:
        mapper:
            # Jackson 3 sorts properties alphabetically by default; keep the declaration order responses had before
            sort-properties-alphabetically: false
    application:
        name: document
    main:
        allow-bean-definition-overriding: true
    cloud:
        consul:
            discovery:
                query-passing: true
                healthCheckPath: /management/health
                instanceId: ${spring.application.name}:${spring.application.instance-id:${random.value}}
            config:
                watch:
                    enabled: false
    jpa:
        open-in-view: false
        properties:
            hibernate.jdbc.time_zone: UTC
        hibernate:
            ddl-auto: none
            naming:
                physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
                implicit-strategy: org.springframework.boot.hibernate.SpringImplicitNamingStrategy
    liquibase:
        change-log: classpath:config/liquibase/master.xml
    messages:
        basename: i18n/messages
    thymeleaf:
        mode: HTML

server:
    servlet:
        session:
            cookie:
                http-only: true

# Properties to be exposed on the /info management endpoint
info:
    # Comma separated list of profiles that will trigger the ribbon to show
    display-ribbon-on-profiles: "dev"

# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================

jhipster:
    async:
        core-pool-size: 2
        max-pool-size: 50
        queue-capacity: 10000
    # By default CORS is disabled. Uncomment to enable.
    #cors:
        #allowed-origins: "*"
        #allowed-methods: "*"
        #allowed-headers: "*"
        #exposed-headers: "Authorization,Link,X-Total-Count"
        #allow-credentials: true
        #max-age: 1800
    mail:
        from: document@localhost
    api-docs:
        default-include-pattern: ${server.servlet.context-path:}/api/**
        management-include-pattern: ${server.servlet.context-path:}/management/**
        title: document API
        description: document API documentation
        version: 0.0.1
    security:
        content-security-policy: "default-src 'self'; frame-src 'self' data:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://storage.googleapis.com; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com data:"

logging:
    file:
        name: build/document.log

# ===================================================================
# Application specific properties
# Add your own application properties here, see the ApplicationProperties class
# to have type-safe configuration, like in the JHipsterProperties above
#
# More documentation is available at:
# https://www.jhipster.tech/common-application-properties/
# ===================================================================

# application:

base-package: com.icthh.xm.tmf.ms.document

xm-config:
    enabled: true
    xm-config-url: http://config
    kafka-config-topic: config_topic

application:
    timelinesEnabled: true
    kafka-enabled: true
    kafka-system-topic: system_topic
    kafka-system-queue: system_queue
    tenant-ignored-path-list: /swagger-resources/configuration/ui, /management/health, /oauth/token_key, /v3/api-docs
    retryThreadCount: 3
    db-schema-suffix:

    lep:
        tenant-script-storage: XM_MS_CONFIG
        lep-resource-path-pattern: /config/tenants/{tenantName}/document/lep/resources/**/*

    retry:
        max-attempts: 3
        delay: 1000 #in milliseconds
        multiplier: 2

    document-generation:
        specification-path-pattern: /config/tenants/{tenantName}/document/documents.yml
        jasper-templates-path-pattern: /config/tenants/{tenantName}/document/templates/jasper/{filename}.jrxml
        carbone-templates-path-pattern: /config/tenants/{tenantName}/document/templates/carbone/{filename}.*

    carbone:
        api-version-key: carbone-version
        api-version-value: 4
