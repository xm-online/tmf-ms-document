# ===================================================================
# Spring Boot configuration.
#
# This configuration is used for unit/integration tests.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
# ===================================================================


spring:
    application:
        name: document
    main:
        allow-bean-definition-overriding: true
    cloud:
        bus:
            enabled: false
        discovery:
            enabled: false
        consul:
            enabled: false
    datasource:
        type: com.zaxxer.hikari.HikariDataSource
        url: jdbc:h2:mem:document;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
        name:
        username:
        password:
        hikari:
            auto-commit: false
    jpa:
        database-platform: org.hibernate.dialect.H2Dialect
        database: H2
        open-in-view: false
        show-sql: false
        hibernate:
            ddl-auto: none
            naming:
                physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
                implicit-strategy: org.springframework.boot.hibernate.SpringImplicitNamingStrategy
        properties:
            hibernate.connection.provider_disables_autocommit: true
            hibernate.cache.use_second_level_cache: false
            hibernate.cache.use_query_cache: false
            hibernate.generate_statistics: true
            hibernate.hbm2ddl.auto: validate
            hibernate.jdbc.time_zone: UTC
    liquibase:
        change-log: classpath:config/liquibase/master.xml
        contexts: test
    mail:
        host: localhost
    messages:
        basename: i18n/messages
    thymeleaf:
        mode: HTML


server:
    port: 10344
    address: localhost

# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================
management:
    health:
        mail:
            enabled: false
    tracing:
        export:
            enabled: false
    otlp:
        metrics:
            export:
                enabled: false
    prometheus:
        metrics:
            export:
                enabled: true

jhipster:
    async:
        core-pool-size: 1
        max-pool-size: 50
        queue-capacity: 10000
    # To test logstash appender
    logging:
        logstash:
            enabled: true
            host: localhost
            port: 5000
            ring-buffer-size: 512
    security:
        content-security-policy: "default-src 'self'; frame-src 'self' data:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://storage.googleapis.com; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com data:"
        authentication:
            jwt:
                # This token must be encoded using Base64 (you can type `echo 'secret-key'|base64` on your command line)
                base64-secret: YWEwZjNjMzg0YmZiMDg2ZmU2NTlkOTRmYThkNjA0ZjA3ODkxZjAxMzVmOGI1NmYwYThmNGNkMTgwZGMxMGRjZWFjMGNhYTk0MjY3NzIyZjkzOTkwODY4YzhkM2RhNTE5N2VmNDNkNGFiMjFmMDA4YTRjYTU3MzJlMzY3NzNmZDM=
                # Token is valid 24 hours
                token-validity-in-seconds: 86400
        client-authorization:
            access-token-uri: http://uaa/oauth/token
            token-service-id: uaa
            client-id: internal
            client-secret: internal

# ===================================================================
# Application specific properties
# Add your own application properties here, see the ApplicationProperties class
# to have type-safe configuration, like in the JHipsterProperties above
#
# More documentation is available at:
# https://www.jhipster.tech/common-application-properties/
# ===================================================================

# application:

xm-config:
    enabled: false

application:
    retryThreadCount: 3
    kafka-system-topic: system_topic
    kafka-system-queue: system_queue
    tenant-ignored-path-list: /swagger-resources/configuration/ui, /management/health, /oauth/token_key, /v3/api-docs
    timelines-enabled: true
    lep:
        tenant-script-storage: XM_MS_CONFIG
        lep-resource-path-pattern: /config/tenants/{tenantName}/entity/lep/resources/**/*

    document-generation:
        specification-path-pattern: /config/tenants/{tenantName}/document/documents.yml
        jasper-templates-path-pattern: /config/tenants/{tenantName}/document/templates/jasper/{filename}.jrxml
        carbone-templates-path-pattern: /config/tenants/{tenantName}/document/templates/carbone/{filename}.*

    carbone:
        api-version-key: carbone-version
        api-version-value: 4
